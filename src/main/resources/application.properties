spring.datasource.url=jdbc:mysql://localhost:3306/resqroute?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
# REQUIRED: the MySQL password is supplied ONLY via the DB_PASSWORD
# environment variable — no password is stored in this repository.
#   PowerShell:   $env:DB_PASSWORD="..."; .\mvnw.cmd spring-boot:run
#   cmd:          set DB_PASSWORD=... && mvnw.cmd spring-boot:run
# If the variable is missing, the application stops immediately at
# start-up with a clear message (see ResQRouteApplication) — it never
# attempts to connect with a wrong or empty password.
# The username may be overridden the same way via DB_USERNAME
# (defaults to "root").
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# Optional ResQRoute configuration (defaults shown; all values may be omitted)
# ---------------------------------------------------------------------------
# OSRM server used for practical road routes (self-host one and point this at it):
#resqroute.osrm.base-url=https://router.project-osrm.org
# Simulated traffic zones: HIGH inside 4 km of the centre, MEDIUM inside 9 km:
#resqroute.traffic.center-latitude=17.3850
#resqroute.traffic.center-longitude=78.4867
#resqroute.traffic.city-core-radius-km=4.0
#resqroute.traffic.inner-ring-radius-km=9.0
# Routing graph: how many nearest landmarks each landmark / request point connects to:
#resqroute.graph.landmark-neighbours=5
#resqroute.graph.dynamic-neighbours=3

# ---------------------------------------------------------------------------
# Staff authentication (Command Center)
# ---------------------------------------------------------------------------
# The first staff account is seeded on first start-up. NO plaintext password
# is ever stored. Either set admin-password-hash to a PasswordEncoder-with-id
# hash, e.g.
#   resqroute.staff.admin-password-hash={bcrypt}$2a$10$...
# or leave it empty: a random password is then generated, hash-stored and
# printed ONCE in the application console. Reset by deleting the staff_user
# row and restarting.
resqroute.staff.admin-username=admin
resqroute.staff.admin-password-hash=

