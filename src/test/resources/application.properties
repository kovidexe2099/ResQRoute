# ============================================================
# Test-only configuration (this file SHADOWS the production
# application.properties when tests run).
#
# - H2 in-memory database instead of MySQL
# - OSRM pointed at a dead port: every OSRM call fails fast,
#   which deterministically exercises the documented fallback
#   (straight-line estimate) instead of hitting the real internet
# ============================================================
spring.datasource.url=jdbc:h2:mem:resqroute;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

resqroute.osrm.base-url=http://127.0.0.1:59999
